name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # forge-std is vendored via `forge install --no-git`, so a fresh checkout
      # has no lib/. Installing it here keeps the repo free of a submodule that
      # every contributor has to remember to init.
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      # Formatting is checked, not applied. A CI job that rewrites the tree
      # makes the diff people review different from the diff they pushed.
      - name: Format check
        run: forge fmt --check
